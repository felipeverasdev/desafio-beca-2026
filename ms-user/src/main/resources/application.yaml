spring:
  datasource:
    url: ${MS_USERS_DB_URL}
    username: ${MS_USERS_DB_USER}
    password: ${MS_USERS_DB_PASS}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
      show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  application:
    name: ms-user

server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: ms-transaction

  datasource:
    url: ${MS_TRANSACTIONS_DB_URL:jdbc:postgresql://localhost:5433/transaction_db}
    username: ${MS_TRANSACTIONS_DB_USER:transaction_admin}
    password: ${MS_TRANSACTIONS_DB_PASS:123456}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

services:
  ms-user:
    url: ${MS_USERS_URL:http://localhost:8081/api/v1/users}
    token: ${INTERNAL_SERVICE_TOKEN}
  mockapi:
    url: ${MOCKAPI_URL:https://6af23d8f42c6561ced39234e.mockapi.io/api/v1/transactions/users}
  brasilapi:
    url: ${BRASILAPI_URL:https://brasilapi.com.br/api/cambio/v1}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html


spring:
  datasource:
    url: jdbc:h2:mem:transaction_testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

services:
  ms-user:
    url: http://localhost:8081/api/v1/users


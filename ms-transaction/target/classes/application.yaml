server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: ms-transaction

  datasource:
    url: ${MS_TRANSACTIONS_DB_URL:jdbc:postgresql://localhost:5433/transaction_db}
    username: ${MS_TRANSACTIONS_DB_USER:transaction_admin}
    password: ${MS_TRANSACTIONS_DB_PASS:123456}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

services:
  ms-user:
    url: ${MS_USERS_URL:http://localhost:8081/api/v1/users}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

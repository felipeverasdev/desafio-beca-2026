services:
  # Banco de Dados do MS1 (ms-user)
  user-db:
    image: postgres:16-alpine
    container_name: ms-user-db
    restart: always
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: ${MS_USERS_DB_USER:-user_admin}
      POSTGRES_PASSWORD: ${MS_USERS_DB_PASS:-123456}
    ports:
      - "${MS_USERS_DB_PORT:-5434}:5432"
    volumes:
      - user_db_data:/var/lib/postgresql/data
    networks:
      - beca-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${MS_USERS_DB_USER:-user_admin} -d user_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Microsserviço 1: Gestão de Usuários
  ms-user:
    build:
      context: ./ms-user
      dockerfile: Dockerfile
    container_name: ms-user
    restart: always
    ports:
      - "${MS_USERS_PORT:-8081}:8081"
    environment:
      - MS_USERS_DB_URL=jdbc:postgresql://user-db:5432/user_db
      - MS_USERS_DB_USER=${MS_USERS_DB_USER:-user_admin}
      - MS_USERS_DB_PASS=${MS_USERS_DB_PASS:-123456}
      - SERVER_PORT=8081
    depends_on:
      user-db:
        condition: service_healthy
    networks:
      - beca-network

  # Banco de Dados do MS2 (ms-transaction)
  transaction-db:
    image: postgres:16-alpine
    container_name: ms-transaction-db
    restart: always
    environment:
      POSTGRES_DB: transaction_db
      POSTGRES_USER: ${MS_TRANSACTIONS_DB_USER:-transaction_admin}
      POSTGRES_PASSWORD: ${MS_TRANSACTIONS_DB_PASS:-123456}
    ports:
      - "${MS_TRANSACTIONS_DB_PORT:-5433}:5432"
    volumes:
      - transaction_db_data:/var/lib/postgresql/data
    networks:
      - beca-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${MS_TRANSACTIONS_DB_USER:-transaction_admin} -d transaction_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Microsserviço 2: Gestão Financeira e Transações (a ser descomentado na implementação do MS2)
  # ms-transaction:
  #   build:
  #     context: ./ms-transaction
  #     dockerfile: Dockerfile
  #   container_name: ms-transaction
  #   restart: always
  #   ports:
  #     - "${MS_TRANSACTIONS_PORT:-8082}:8082"
  #   environment:
  #     - MS_TRANSACTIONS_DB_URL=jdbc:postgresql://transaction-db:5432/transaction_db
  #     - MS_TRANSACTIONS_DB_USER=${MS_TRANSACTIONS_DB_USER:-transaction_admin}
  #     - MS_TRANSACTIONS_DB_PASS=${MS_TRANSACTIONS_DB_PASS:-123456}
  #     - MS_USERS_URL=http://ms-user:8081/api/v1/users
  #     - SERVER_PORT=8082
  #   depends_on:
  #     transaction-db:
  #       condition: service_healthy
  #     ms-user:
  #       condition: service_started
  #   networks:
  #     - beca-network

# Volumes persistentes para não perder dados ao reiniciar containers
volumes:
  user_db_data:
    driver: local
  transaction_db_data:
    driver: local

# Rede compartilhada para comunicação interna entre microsserviços e bancos
networks:
  beca-network:
    driver: bridge
